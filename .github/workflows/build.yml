name: Build APK

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the APK as a GitHub release"
        type: boolean
        default: false
      tag:
        description: "Release tag (empty = automatic)"
        type: string
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and CMake
        run: sdkmanager --install "ndk;26.3.11579264" "cmake;3.22.1" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.6"

      - name: Compute release metadata
        id: meta
        run: |
          VERSION=$(grep '^avg.versionName=' gradle.properties | cut -d= -f2)
          if [ "${{ github.ref_type }}" = "branch" ] && [ "${{ github.ref_name }}" = "$DEFAULT_BRANCH" ]; then
            PRERELEASE=false
            SUFFIX=""
          else
            PRERELEASE=true
            SLUG=$(echo "${{ github.ref_name }}" | tr '/_' '--' | tr -cd 'A-Za-z0-9.-')
            SUFFIX="-${SLUG}.${{ github.run_number }}"
          fi
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then TAG="v${VERSION}${SUFFIX}"; fi
          echo "version=${VERSION}${SUFFIX}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${PRERELEASE}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Version: ${VERSION}${SUFFIX}, tag: ${TAG}, pre-release: ${PRERELEASE}"

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            {
              echo "AVG_KEYSTORE_PATH=$RUNNER_TEMP/release.jks"
              echo "AVG_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "AVG_KEY_ALIAS=$KEY_ALIAS"
              echo "AVG_KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
          else
            echo "::warning::No KEYSTORE_BASE64 secret. The APK uses the debug key."
          fi

      - name: Build release APK
        env:
          AVG_VERSION_CODE: ${{ github.run_number }}
        run: gradle :app:assembleRelease --stacktrace

      - name: Name the APK
        id: apk
        run: |
          NAME="AndroidVirtualGamepad-${{ steps.meta.outputs.version }}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.name }}

      - name: Publish release
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
          APK: ${{ steps.apk.outputs.name }}
          TAG: ${{ steps.meta.outputs.tag }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
        run: |
          FLAGS="--generate-notes --target ${{ github.sha }}"
          if [ "$PRERELEASE" = "true" ]; then FLAGS="$FLAGS --prerelease"; else FLAGS="$FLAGS --latest"; fi
          gh release create "$TAG" "$APK" --title "$TAG" $FLAGS
