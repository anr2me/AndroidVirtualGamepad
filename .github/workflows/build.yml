name: Build APK

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the APK as a GitHub release"
        type: boolean
        default: false
      version:
        description: "Version, for example 1.2.0 (empty = avg.versionName in gradle.properties)"
        type: string
        default: ""
      accessibility:
        description: "Add Accessibility mode (Google Play Protect can block an APK that has it)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        # The GitHub runner image already contains the Android SDK (ANDROID_HOME).
        run: |
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -n1)"
          fi
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "ndk;26.3.11579264" "cmake;3.22.1" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.6"

      - name: Compute release metadata
        id: meta
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          VERSION="$(echo "$INPUT_VERSION" | xargs)"
          VERSION="${VERSION#v}"
          if [ -z "$VERSION" ]; then
            VERSION=$(grep '^avg.versionName=' gradle.properties | cut -d= -f2)
          fi
          if ! echo "$VERSION" | grep -Eq '^[0-9]+(\.[0-9]+)*(-[0-9A-Za-z.]+)?$'; then
            echo "::error::The version must look like 1.2.0 or 1.2.0-beta1. The value is '$VERSION'."
            exit 1
          fi
          if [ "$REF_TYPE" = "branch" ] && [ "$REF_NAME" = "$DEFAULT_BRANCH" ]; then
            PRERELEASE=false
            SUFFIX=""
          else
            PRERELEASE=true
            SLUG=$(echo "$REF_NAME" | tr '/_' '--' | tr -cd 'A-Za-z0-9.-')
            SUFFIX="-${SLUG}.${RUN_NUMBER}"
          fi
          FINAL="${VERSION}${SUFFIX}"
          # The APK versionName, the file name and the release tag all use the same value.
          echo "version=${FINAL}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${PRERELEASE}" >> "$GITHUB_OUTPUT"
          echo "tag=v${FINAL}" >> "$GITHUB_OUTPUT"
          echo "Version: ${FINAL}, tag: v${FINAL}, pre-release: ${PRERELEASE}"

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            {
              echo "AVG_KEYSTORE_PATH=$RUNNER_TEMP/release.jks"
              echo "AVG_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "AVG_KEY_ALIAS=$KEY_ALIAS"
              echo "AVG_KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
          else
            echo "::warning::No KEYSTORE_BASE64 secret. The APK uses the debug key."
          fi

      - name: Build release APK
        env:
          AVG_VERSION_CODE: ${{ github.run_number }}
          APP_VERSION: ${{ steps.meta.outputs.version }}
          ACCESSIBILITY: ${{ inputs.accessibility }}
        run: gradle :app:assembleRelease -Pavg.versionName="$APP_VERSION" -Pavg.accessibility="$ACCESSIBILITY" --stacktrace

      - name: Check the APK version
        env:
          APP_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          AAPT2="$(ls -d "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -n1)"
          BADGING="$("$AAPT2" dump badging app/build/outputs/apk/release/app-release.apk)"
          echo "$BADGING" | grep -m1 '^package:'
          echo "$BADGING" | grep -qF "versionName='$APP_VERSION'" || {
            echo "::error::The versionName of the APK is not $APP_VERSION."
            exit 1
          }

      - name: Name the APK
        id: apk
        env:
          ACCESSIBILITY: ${{ inputs.accessibility }}
        run: |
          SUFFIX=""
          if [ "$ACCESSIBILITY" = "true" ]; then SUFFIX="-accessibility"; fi
          NAME="AndroidVirtualGamepad-${{ steps.meta.outputs.version }}${SUFFIX}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.name }}

      - name: Publish release
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
          APK: ${{ steps.apk.outputs.name }}
          TAG: ${{ steps.meta.outputs.tag }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
        run: |
          FLAGS="--generate-notes --target ${{ github.sha }}"
          if [ "$PRERELEASE" = "true" ]; then FLAGS="$FLAGS --prerelease"; else FLAGS="$FLAGS --latest"; fi
          gh release create "$TAG" "$APK" --title "$TAG" $FLAGS
